name: build-deb

on:
  push:
    tags: ["v*-debian13*", "v*-e13*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "12.22.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev libsecret-1-dev libx11-dev libxext-dev fakeroot

      - name: Build Atom + .deb
        env:
          ATOM_ELECTRON_URL: https://electronjs.org/headers
          GYP_DEFINES: "openssl_fips= "
          npm_config_node_gyp: ${{ github.workspace }}/script/patches/node-gyp/bin/node-gyp.js
        run: ./script/build --create-debian-package

      - uses: actions/upload-artifact@v4
        with:
          name: atom-deb
          path: out/*.deb

      - name: Publish .deb to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
